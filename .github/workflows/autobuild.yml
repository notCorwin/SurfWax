name: Continuous Delivery

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # CI (types, tests, browsers and performance) is completed locally before push.
      # CD rebuilds and validates the distributable and its SHA-256 only.
      - run: npm run release:package
      - name: Verify packaged checksum
        run: cd .dev/releases && sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: .dev/releases/
          if-no-files-found: error

  autobuild:
    needs: package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: release/
      - run: node scripts/prepare-autobuild-release.mjs release
      - name: Update test channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          git tag -f autobuild "$GITHUB_SHA"
          git push origin refs/tags/autobuild --force
          if gh release view autobuild >/dev/null 2>&1; then
            gh release edit autobuild --verify-tag --title "Surf Wax Autobuild" --prerelease --latest=false --notes-file release/autobuild-notes.md
            gh release upload autobuild release/surf-wax-autobuild.zip release/surf-wax-autobuild.zip.sha256 --clobber
          else
            gh release create autobuild --verify-tag --title "Surf Wax Autobuild" --prerelease --latest=false --notes-file release/autobuild-notes.md release/surf-wax-autobuild.zip release/surf-wax-autobuild.zip.sha256
          fi
          gh release download autobuild --pattern surf-wax-autobuild.zip --pattern surf-wax-autobuild.zip.sha256 --dir "$RUNNER_TEMP/autobuild-verify"
          (cd "$RUNNER_TEMP/autobuild-verify" && sha256sum -c surf-wax-autobuild.zip.sha256)
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/autobuild" --jq '.object.sha')" = "$GITHUB_SHA"

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: release/
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; versioned assets are immutable."
            exit 1
          fi
          cd release
          sha256sum -c *.sha256
          cd ..
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Surf Wax $GITHUB_REF_NAME" --notes-file release/release-notes.md release/*.zip release/*.sha256
