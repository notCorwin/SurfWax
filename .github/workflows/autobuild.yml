name: Verify and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run check
      - run: npm test
      - run: npm run release:package
      - uses: actions/upload-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: .dev/releases/
          if-no-files-found: error

  browser:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chrome: ['138', current]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: .dev/release-candidate/
      - name: Verify and unpack the release candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd .dev/release-candidate && sha256sum -c *.sha256)
          unzip -q .dev/release-candidate/*.zip -d dist
          node scripts/validate-build.mjs dist
          node scripts/prepare-upgrade-fixture.mjs
      - run: npx playwright install-deps chromium
      - id: chrome
        run: node scripts/install-test-browser.mjs ${{ matrix.chrome }}
      - run: npx playwright test --grep-invert @performance
        env:
          SURFWAX_EXTENSION_PATH: dist
          SURFWAX_CHROME_PATH: ${{ steps.chrome.outputs.executable }}
          SURFWAX_CHROME_VERSION: ${{ steps.chrome.outputs.version }}
      - name: Stage canonical log evidence for upload
        if: ${{ !cancelled() }}
        shell: bash
        # GitHub-hosted jobs contain only fresh mkdtemp fixture profiles and
        # localhost mock-provider data; no user's installed Chrome profile.
        run: |
          set -euo pipefail
          mkdir -p .dev/ci-evidence
          if test -d ../.dev/chromium-profile/Default/IndexedDB; then
            cp -R ../.dev/chromium-profile/Default/IndexedDB .dev/ci-evidence/IndexedDB
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence-${{ matrix.chrome }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .dev/ci-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  autobuild:
    needs: [verify, browser]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: release/
      - run: node scripts/prepare-autobuild-release.mjs release
      - name: Update verified test channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA"
          git tag -f autobuild "$GITHUB_SHA"
          git push origin refs/tags/autobuild --force
          if gh release view autobuild >/dev/null 2>&1; then
            gh release edit autobuild --verify-tag --title "Surf Wax Autobuild" --prerelease --latest=false --notes-file release/autobuild-notes.md
            gh release upload autobuild release/surf-wax-autobuild.zip release/surf-wax-autobuild.zip.sha256 --clobber
          else
            gh release create autobuild --verify-tag --title "Surf Wax Autobuild" --prerelease --latest=false --notes-file release/autobuild-notes.md release/surf-wax-autobuild.zip release/surf-wax-autobuild.zip.sha256
          fi
          gh release download autobuild --pattern surf-wax-autobuild.zip --pattern surf-wax-autobuild.zip.sha256 --dir "$RUNNER_TEMP/autobuild-verify"
          (cd "$RUNNER_TEMP/autobuild-verify" && sha256sum -c surf-wax-autobuild.zip.sha256)
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/autobuild" --jq '.object.sha')" = "$GITHUB_SHA"

  release:
    needs: [verify, browser]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: surf-wax-${{ github.sha }}
          path: release/
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; versioned assets are immutable."
            exit 1
          fi
          cd release
          sha256sum -c *.sha256
          cd ..
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Surf Wax $GITHUB_REF_NAME" --notes-file release/release-notes.md release/*.zip release/*.sha256
