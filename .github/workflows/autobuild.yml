name: Autobuild Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autobuild-release
  cancel-in-progress: false

jobs:
  autobuild:
    name: Build and publish Autobuild
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Verify Autobuild channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          test "$current_sha" = "$GITHUB_SHA"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run extension E2E and performance checks
        run: npm run test:e2e

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/manifest.json
          test -f dist/sidepanel.html
          test -f dist/options.html

          archive="$RUNNER_TEMP/surf-wax-autobuild.zip"
          (cd dist && zip -qr "$archive" . -x '*.DS_Store')
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "CHECKSUM=$archive.sha256" >> "$GITHUB_ENV"

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/autobuild-release-notes.md" <<EOF
          Automated Chrome extension build for commit \`$GITHUB_SHA\`.

          Install:

          1. Download \`surf-wax-autobuild.zip\` and extract it.
          2. Open \`chrome://extensions\` and enable Developer mode.
          3. Choose **Load unpacked** and select the extracted directory containing \`manifest.json\`.

          The SHA-256 checksum is available in \`surf-wax-autobuild.zip.sha256\`.
          EOF

      - name: Replace Autobuild release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repository="$GITHUB_REPOSITORY"
          tag="autobuild"

          current_sha="$(gh api "repos/$repository/git/ref/heads/master" --jq '.object.sha')"
          test "$current_sha" = "$GITHUB_SHA"

          if gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$repository" --cleanup-tag --yes
          else
            gh api --method DELETE "repos/$repository/git/refs/tags/$tag" >/dev/null 2>&1 || true
          fi

          gh release create "$tag" \
            --repo "$repository" \
            --target "$GITHUB_SHA" \
            --title "Autobuild" \
            --notes-file "$RUNNER_TEMP/autobuild-release-notes.md" \
            --latest \
            "$ARCHIVE" \
            "$CHECKSUM"

          verify_dir="$RUNNER_TEMP/autobuild-release-verify"
          mkdir -p "$verify_dir"
          gh release download "$tag" \
            --repo "$repository" \
            --pattern "$(basename "$ARCHIVE")" \
            --pattern "$(basename "$CHECKSUM")" \
            --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c "$(basename "$CHECKSUM")")

          final_sha="$(gh api "repos/$repository/git/ref/tags/$tag" --jq '.object.sha')"
          test "$final_sha" = "$GITHUB_SHA"

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
