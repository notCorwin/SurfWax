name: Core regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Installed Chrome development E2E
        env:
          SURFWAX_CHROME_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-failure-evidence
          path: .dev/artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
